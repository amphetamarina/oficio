name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write   # PEP 740 OIDC — needed for PyPI Trusted Publishing + Sigstore
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oficio
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        # OIDC + Sigstore attestations automatic — no API token needed
        with:
          attestations: true
